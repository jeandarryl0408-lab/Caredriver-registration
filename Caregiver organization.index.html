<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CareDrive Organization Registration</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background:
        linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.8)),
        url("https://images.unsplash.com/photo-1488521787991-ed7bbaae773c")
        center/cover;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 90%;
        max-width: 600px;
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
        text-align: center;
        color: #2b7a78;
    }

    .tagline {
        text-align: center;
        font-size: 18px;
        color: #555;
        margin-bottom: 25px;
        font-style: italic;
    }

    p {
        text-align: center;
        color: #444;
    }

    label {
        font-weight: bold;
        display: block;
        margin-top: 15px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
    }

    button {
        width: 100%;
        margin-top: 25px;
        padding: 14px;
        border: none;
        background: #2b7a78;
        color: white;
        font-size: 17px;
        border-radius: 10px;
        cursor: pointer;
    }

    button:hover {
        background: #205f5d;
    }

    .qr {
        text-align:center;
        margin-top:30px;
    }

    .qr img {
        width:150px;
    }

</style>

</head>


<body>

<div class="container">

<h1>CareDrive Organization</h1>

<div class="tagline">
"Driving Compassion, Building Stronger Communities"
</div>

<p>
Join CareDrive Organization and become part of a community dedicated 
to service, care, and meaningful change.
</p>


<form>

<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>


<label>Age</label>
<input 
type="number" 
min="18" 
placeholder="Must be 18 years old and above"
required>


<label>Email Address</label>
<input 
type="email" 
placeholder="Enter your email address"
required>


<label>Phone Number</label>
<input 
type="tel" 
placeholder="Enter your phone number"
required>


<button type="submit">
Register Now
</button>


</form>


<div class="qr">

<h3>Scan to Register</h3>

<!-- Replace the link below with your hosted website link -->

<img 
src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://yourwebsite.com"
alt="Registration QR Code">

</div>


</div>


</body>
</html>
